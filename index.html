<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Display font (changeling-neo) — Adobe Typekit -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/efx4kwc.css" />
    <!-- Body text uses Helvetica Neue (system font); wordmark uses changeling-neo-stencil (Typekit). Mono (Space Mono) is self-hosted in /public/fonts -->
    <link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://www.mettaire.com/" />
    <!-- SEO note: lead with role + employer so a Google of "Daniel Nelson"
         surfaces professional context in the snippet before the artistic
         framing. Description sits under the ~160-char SERP truncation limit. -->
    <meta name="description" content="METTAIRE — Daniel Nelson, DevOps engineer at Salesforce and multimedia artist. Engineering case studies (FedRAMP, incident response, CI/CD), a gallery of work, and BLACKSITE arcade." />
    <meta name="author" content="Daniel Nelson" />
    <meta name="theme-color" content="#050505" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="METTAIRE" />
    <meta property="og:title" content="Daniel Nelson — DevOps engineer @ Salesforce · multimedia artist" />
    <meta property="og:description" content="Portfolio of Daniel Nelson: engineering case studies (FedRAMP GovCloud, CI/CD, incident response), a multimedia gallery, and BLACKSITE — an in-browser arcade." />
    <meta property="og:url" content="https://www.mettaire.com/" />
    <meta property="og:image" content="https://www.mettaire.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="METTAIRE — Daniel Nelson, DevOps engineer @ Salesforce and multimedia artist" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daniel Nelson — DevOps engineer @ Salesforce · multimedia artist" />
    <meta name="twitter:description" content="Portfolio of Daniel Nelson: engineering case studies (FedRAMP GovCloud, CI/CD, incident response), a multimedia gallery, and BLACKSITE — an in-browser arcade." />
    <meta name="twitter:image" content="https://www.mettaire.com/og-image.jpg" />

    <title>METTAIRE — Daniel Nelson · DevOps @ Salesforce · multimedia artist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
